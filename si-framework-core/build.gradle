/*
 * Gradle 및 IntelliJ에서 모듈의 역할을 식별하기 위한 설명이다.
 *
 * 빌드 동작에 직접적인 영향을 주는 설정은 아니지만,
 * 멀티 모듈 프로젝트에서 각 모듈의 책임을 명확하게 표현한다.
 */
description = 'SI 공통 프레임워크 핵심 모듈'

/*
 * 이 모듈이 사용하는 외부 라이브러리 또는
 * 다른 프로젝트 모듈의 의존성을 선언하는 영역이다.
 */
dependencies {

    /*
     * 현재 core 모듈은 외부 라이브러리에 의존하지 않는다.
     *
     * 예외 모델, 오류 코드, 시간 추상화 등
     * 순수 Java 기반 공통 기능을 작성할 예정이므로 비워둔다.
     *
     * JUnit 의존성은 루트 build.gradle의
     * subprojects 설정에서 이미 공통 적용되고 있다.
     */
}