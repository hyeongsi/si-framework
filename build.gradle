/*
 * 모든 모듈의 group과 version 통일
 * 모든 모듈의 Java 버전 통일
 * 모든 모듈의 테스트 환경 통일
 * 모든 모듈의 문자 인코딩 통일
 * 공통 Gradle 플러그인 적용
 */

/*
 * 하위 모듈에서 사용할 Gradle 플러그인과 버전을
 * 루트 프로젝트에서 중앙 관리한다.
 */
plugins {

    /*
     * Spring Boot 애플리케이션을 실행하고
     * 실행 가능한 JAR을 만들기 위한 플러그인이다.
     *
     * apply false이므로 루트 프로젝트에는 실제 적용하지 않는다.
     * 필요한 하위 모듈에서만 플러그인을 적용한다.
     */
    id 'org.springframework.boot' version '4.1.0' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
}

/*
 * 모든 프로젝트에 공통으로 적용할 기본 정보를 설정한다.
 *
 * 여기서 말하는 모든 프로젝트는:
 * - 루트 프로젝트 si-framework
 * - 하위 모듈 si-framework-core
 * - 앞으로 추가할 si-framework-web
 * - 앞으로 추가할 si-framework-data-jpa
 * 등을 포함한다.
 */
allprojects {

    /*
     * Maven 좌표에서 group에 해당한다.
     *
     * 나중에 JAR을 배포하면 다음과 같은 좌표가 만들어진다.
     *
     * com.example.siframework:si-framework-core:0.1.0-SNAPSHOT
     */
    group = 'com.example.siframework'

    /*
     * 현재 프레임워크 버전이다.
     *
     * SNAPSHOT은 아직 개발 중인 버전이라는 의미다.
     * 정식 배포 시에는 0.1.0처럼 SNAPSHOT을 제거한다.
     */
    version = '0.1.0-SNAPSHOT'
}

/*
 * 루트 프로젝트를 제외한 모든 하위 모듈에 공통 설정을 적용한다.
 *
 * 현재는 si-framework-core에 적용된다.
 * 이후 추가되는 web, data-jpa 모듈에도 자동 적용된다.
 */
subprojects {

    /*
     * 하위 모듈을 Java 라이브러리 프로젝트로 만든다.
     *
     * 일반 java 플러그인보다 라이브러리 개발에 적합하다.
     * api와 implementation 의존성을 구분할 수 있다.
     */
    apply plugin: 'java-library'

    /*
     * 프로젝트에서 사용할 Java 버전을 지정한다.
     */
    java {

        /*
         * 개발자 PC의 JAVA_HOME에만 의존하지 않고,
         * Gradle이 사용할 Java 도구 버전을 명확히 지정한다.
         */
        toolchain {

            /*
             * 모든 하위 모듈을 Java 21 기준으로
             * 컴파일하고 테스트하도록 설정한다.
             */
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    /*
     * 모든 하위 모듈에 공통 테스트 의존성을 추가한다.
     */
    dependencies {

        /*
         * JUnit 관련 라이브러리의 버전을 일관되게 맞추는 BOM이다.
         *
         * BOM을 사용하면 junit-jupiter 등에
         * 버전을 반복해서 작성하지 않아도 된다.
         */
        testImplementation platform('org.junit:junit-bom:5.13.1')

        /*
         * JUnit Jupiter 테스트 API와 실행 엔진을 사용한다.
         *
         * @Test, assertEquals 등의 기능을 제공한다.
         */
        testImplementation 'org.junit.jupiter:junit-jupiter'

        /*
         * Gradle 또는 IntelliJ에서 JUnit Platform 테스트를
         * 안정적으로 실행하기 위한 런처다.
         */
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    /*
     * 모든 Test 타입 작업에 공통 테스트 실행 방식을 지정한다.
     */
    tasks.withType(Test).configureEach {

        /*
         * JUnit 5 기반 테스트를 실행하도록 설정한다.
         */
        useJUnitPlatform()
    }

    /*
     * 모든 Java 컴파일 작업에 공통 옵션을 적용한다.
     */
    tasks.withType(JavaCompile).configureEach {

        /*
         * Java 소스 파일 인코딩을 UTF-8로 고정한다.
         *
         * 한글 주석, 한글 테스트 메서드명,
         * 한글 예외 메시지가 깨지는 것을 방지한다.
         */
        options.encoding = 'UTF-8'

        /*
         * 컴파일된 클래스 파일에 메서드 파라미터 이름을 보존한다.
         *
         * Spring의 생성자 바인딩, 리플렉션,
         * 요청 파라미터 처리 등에 도움이 된다.
         */
        options.compilerArgs.add('-parameters')
    }
}