/*
 * 이 모듈을 Spring Boot 실행 애플리케이션으로 만든다.
 *
 * 루트 build.gradle에서 버전을 이미 선언했으므로
 * 여기서는 버전을 반복해서 작성하지 않는다.
 */
plugins {
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
}

/*
 * 멀티 모듈 프로젝트에서 이 모듈의 역할을 설명한다.
 */
description = 'SI 공통 프레임워크 사용 예제 애플리케이션'

/*
 * sample 애플리케이션에서 사용할 의존성을 선언한다.
 */
dependencies {

    /*
     * 현재 프로젝트의 si-framework-core 모듈을 사용한다.
     *
     * sample은 core에 정의된 ErrorCode,
     * BusinessException, SystemException 등을 사용할 수 있다.
     */
    implementation project(':si-framework-core')

    /*
     * Spring Boot의 핵심 자동 설정과 애플리케이션 실행 기능을 사용한다.
     *
     * 현재는 웹 API를 만들지 않으므로 spring-boot-starter만 사용한다.
     */
    implementation 'org.springframework.boot:spring-boot-starter'

    /*
     * Spring Boot 기반 통합 테스트 기능을 제공한다.
     *
     * JUnit, AssertJ, Spring Test 등의 테스트 도구를 포함한다.
     */
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}