/*
 * 이 모듈을 Spring Boot 실행 애플리케이션으로 만든다.
 *
 * 루트 build.gradle에서 버전을 이미 선언했으므로
 * 여기서는 버전을 반복해서 작성하지 않는다.
 */
plugins {
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
}

/*
 * 멀티 모듈 프로젝트에서 이 모듈의 역할을 설명한다.
 */
description = 'SI 공통 프레임워크 사용 예제 애플리케이션'

/*
 * sample 애플리케이션에서 사용할 의존성을 선언한다.
 */
dependencies {

    /*
     * 순수 Java 기반 핵심 프레임워크 기능을 사용한다.
     */
    implementation project(':si-framework-core')

    /*
     * JPA 기반 프레임워크 공통 기능을 사용한다.
     *
     * 앞으로 BaseTimeEntity, 공통 Repository,
     * JPA 감사 기능 등을 sample에서 검증한다.
     */
    implementation project(':si-framework-data-jpa')

    /*
     * Spring Boot 기본 실행 기능을 사용한다.
     */
    implementation 'org.springframework.boot:spring-boot-starter'

    /*
     * sample 실행과 테스트에서 사용할 인메모리 데이터베이스다.
     *
     * 운영 프레임워크 라이브러리에 포함되는 DB가 아니라
     * sample 애플리케이션에서만 사용하는 DB다.
     */
    runtimeOnly 'com.h2database:h2'

    /*
     * sample 모듈의 Spring Boot 통합 테스트를 지원한다.
     */
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}