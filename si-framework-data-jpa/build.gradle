plugins {
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
}

/*
 * 이 모듈의 역할을 설명한다.
 *
 * Gradle 빌드 동작에 직접적인 영향을 주지는 않지만,
 * 멀티 모듈 프로젝트에서 모듈 책임을 명확하게 표현한다.
 */
description = 'SI 공통 프레임워크 JPA 데이터 모듈'

/*
 * data-jpa 모듈이 사용하는 라이브러리와
 * 다른 프로젝트 모듈을 선언한다.
 */
dependencies {

    /*
     * 프레임워크 핵심 공통 모듈을 사용한다.
     *
     * data-jpa에서 공통 오류 코드와 예외 등의
     * core 공개 API를 사용할 수 있게 한다.
     *
     * implementation을 사용했으므로 data-jpa 내부 구현에서 사용하며,
     * data-jpa를 사용하는 외부 프로젝트에 core 의존성을
     * 공개 API로 강제 노출하지 않는다.
     */
    implementation project(':si-framework-core')

    /*
     * Spring Data JPA 기능을 제공하는 Spring Boot Starter다.
     *
     * 대표적으로 다음 의존성을 포함한다.
     * - Jakarta Persistence API
     * - Spring Data JPA
     * - Hibernate ORM
     * - Spring ORM
     * - 트랜잭션 지원
     */
    api 'org.springframework.boot:spring-boot-starter-data-jpa'

    /*
     * Spring Boot 기반 JPA 테스트 기능을 제공한다.
     *
     * @DataJpaTest, AssertJ, JUnit, Spring Test 등을 사용할 수 있다.
     */
    testImplementation 'org.springframework.boot:spring-boot-starter-test'

    /*
     * 테스트 실행 시 사용할 인메모리 데이터베이스다.
     *
     * 운영 코드에는 포함하지 않고 테스트 실행 시점에만 사용한다.
     */
    testRuntimeOnly 'com.h2database:h2'
}