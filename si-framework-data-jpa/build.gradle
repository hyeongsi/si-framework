plugins {
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
}

/*
 * 이 모듈의 역할을 설명한다.
 *
 * Gradle 빌드 동작에 직접적인 영향을 주지는 않지만,
 * 멀티 모듈 프로젝트에서 모듈 책임을 명확하게 표현한다.
 */
description = 'SI 공통 프레임워크 JPA 데이터 모듈'

/*
 * data-jpa 모듈이 사용하는 라이브러리와
 * 다른 프로젝트 모듈을 선언한다.
 */
dependencies {

    /*
     * data-jpa의 공개 API가 CurrentAuditorProvider 같은
     * core 타입을 생성자와 메서드 계약에 노출한다.
     *
     * data-jpa 사용자가 해당 타입을 컴파일할 수 있도록
     * core 의존성을 api로 공개한다.
     */
    api project(':si-framework-core')

    /*
     * JPA 및 Spring Data JPA 타입이 data-jpa의
     * 공개 API에 사용되므로 소비 프로젝트에 공개한다.
     */
    api 'org.springframework.boot:spring-boot-starter-data-jpa'

    /*
     * Spring Boot 기반 JPA 테스트 기능을 제공한다.
     *
     * @DataJpaTest, AssertJ, JUnit, Spring Test 등을 사용할 수 있다.
     */
    testImplementation 'org.springframework.boot:spring-boot-starter-test'

    /*
     * 테스트 실행 시 사용할 인메모리 데이터베이스다.
     *
     * 운영 코드에는 포함하지 않고 테스트 실행 시점에만 사용한다.
     */
    testRuntimeOnly 'com.h2database:h2'
}