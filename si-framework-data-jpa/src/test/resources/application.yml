spring:
  datasource:
    # 각 테스트 실행에서 사용하는 H2 인메모리 데이터베이스다.
    url: jdbc:h2:mem:data-jpa-test;DB_CLOSE_DELAY=-1

    # H2 JDBC 드라이버다.
    driver-class-name: org.h2.Driver

    # H2 기본 사용자 계정이다.
    username: sa

    # 테스트 DB이므로 비밀번호를 사용하지 않는다.
    password:

  jpa:
    hibernate:
      # 테스트 시작 시 테이블을 생성하고 종료 시 제거한다.
      ddl-auto: create-drop

    # 테스트 로그가 지나치게 길어지지 않도록 SQL 출력을 끈다.
    show-sql: true

    properties:
      hibernate:
        # SQL 출력을 활성화했을 때 쿼리를 정렬한다.
        format_sql: true

    # 테스트에서도 트랜잭션 경계를 명확히 하기 위해 비활성화한다.
    open-in-view: false